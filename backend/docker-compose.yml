# Local-dev compose for the SnoreGuard backend.
#
#   docker compose up -d                          # postgres only
#   docker compose --profile app up -d            # postgres + all three services
#   docker compose --profile app --profile otel up -d
#                                                 # + otel collector for traces/metrics
#
# Each service exposes a different port:
#   sync-service       :8080
#   analytics-service  :8081
#   export-service     :8082
#   otel-collector     :4318 (OTLP HTTP), :4317 (OTLP gRPC)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snoreguard
      POSTGRES_PASSWORD: dev-only-password
      POSTGRES_DB: snoreguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snoreguard -d snoreguard"]
      interval: 2s
      timeout: 5s
      retries: 10

  otel-collector:
    profiles: ["otel"]
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  sync-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      ADDR: ":8080"
      DATABASE_URL: postgres://snoreguard:dev-only-password@postgres:5432/snoreguard?sslmode=disable
      JWT_SIGNING_KEY: change-me-to-a-real-32-byte-secret-please-1234567890
      APPLE_AUDIENCE: com.snoreguard.app
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  analytics-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    environment:
      ADDR: ":8081"
      DATABASE_URL: postgres://snoreguard:dev-only-password@postgres:5432/snoreguard?sslmode=disable
      JWT_SIGNING_KEY: change-me-to-a-real-32-byte-secret-please-1234567890
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  export-service:
    profiles: ["app"]
    build:
      context: .
      dockerfile: export-service/Dockerfile
    environment:
      ADDR: ":8082"
      DATABASE_URL: postgres://snoreguard:dev-only-password@postgres:5432/snoreguard?sslmode=disable
      JWT_SIGNING_KEY: change-me-to-a-real-32-byte-secret-please-1234567890
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
