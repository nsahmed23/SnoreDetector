# Minimal OpenTelemetry Collector config for local development.
# Receives OTLP from the three services and prints to stdout. Swap
# the `debug` exporter for `otlphttp` / `prometheus` / `jaeger` etc.
# in production.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
