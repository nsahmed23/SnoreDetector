# Minimal OpenTelemetry Collector config for local development.
# Receives OTLP from the three services. Traces go to the debug
# stdout exporter; metrics go to both debug *and* a Prometheus
# exporter on :9464 so `curl localhost:9464/metrics` after some
# traffic shows the counters/histograms incrementing in real time.
#
# Swap `debug` and `prometheus` for `otlphttp` / Tempo / Jaeger /
# Mimir / cortex etc. in production.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  debug:
    verbosity: normal
  prometheus:
    endpoint: 0.0.0.0:9464

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus]
